<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>201 Walkthrough</title>
<style>
  @font-face { font-family: 'NotoJP'; font-weight: 400; src: url('node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoJP'; font-weight: 500; src: url('node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoJP'; font-weight: 700; src: url('node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; font-family: 'NotoJP', sans-serif; }
  canvas { display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  .tag { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.92); color: #2b2b2b;
         padding: 10px 22px; border-radius: 40px; font-size: 30px; font-weight: 500; white-space: nowrap;
         box-shadow: 0 6px 24px rgba(0,0,0,.18); letter-spacing: .04em; }
  .tag small { font-size: 22px; color: #777; margin-left: 10px; font-weight: 400; }
  #title { position: absolute; left: 96px; top: 84px; color: #2a2a2a; }
  #title .no { font-size: 92px; font-weight: 700; letter-spacing: .02em; line-height: 1; }
  #title .sub { font-size: 36px; font-weight: 500; margin-top: 14px; color: #555; letter-spacing: .08em; }
  #caption { position: absolute; left: 96px; bottom: 90px; }
  #caption .room { font-size: 54px; font-weight: 700; text-shadow: 0 2px 18px rgba(0,0,0,.45); letter-spacing: .06em; }
  #caption .size { font-size: 30px; font-weight: 500; margin-top: 6px; text-shadow: 0 2px 14px rgba(0,0,0,.5); opacity: .95; }
  #caption .bar { width: 64px; height: 4px; background: #fff; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #note { position: absolute; right: 60px; bottom: 40px; font-size: 20px; color: rgba(255,255,255,.75); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #fade { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #endcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #2a2a2a; opacity: 0; }
  #endcard .no { font-size: 110px; font-weight: 700; }
  #endcard .sub { font-size: 40px; color: #555; margin-top: 10px; letter-spacing: .1em; }
  #endcard .fine { font-size: 22px; color: #888; margin-top: 40px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/",
    "three/examples/jsm/": "./node_modules/three/examples/jsm/",
    "n8ao": "./node_modules/n8ao/dist/N8AO.js",
    "postprocessing": "./node_modules/postprocessing/build/index.js"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="overlay">
    <div id="tags"></div>
    <div id="title"><div class="no">201</div><div class="sub">1LDK ・ 49.90㎡</div></div>
    <div id="caption"><div class="bar"></div><div class="room"></div><div class="size"></div></div>
    <div id="note">間取り図・写真をもとにしたイメージ（寸法は概算）</div>
    <div id="fade"></div>
    <div id="endcard"><div class="no">201</div><div class="sub">1LDK ・ 49.90㎡</div><div class="fine">間取り図と現地写真をもとに作成したイメージ映像です。実際とは異なる場合があります。</div></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
